[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sylhet_aa"
version = "0.1.0"
description = "Rainfall trigger thresholds for flash flood anticipatory action in Sylhet, Bangladesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Naimul Islam", email = "naimul.islam.bangladesh@gmail.com" },
]
keywords = [
    "flash flood", "anticipatory action", "CHIRPS", "Sentinel-1",
    "Sylhet", "Bangladesh", "remote sensing", "disaster risk reduction",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "shapely>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "black>=24.0",
]
all = [
    "geopandas>=0.14",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "black>=24.0",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "tqdm>=4.65",
]

[project.urls]
Repository = "https://github.com/Naimul-islam-bd/sylhet_flash_flood_aa"
Documentation = "https://github.com/Naimul-islam-bd/sylhet_flash_flood_aa#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
